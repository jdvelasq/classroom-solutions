- id: 1
  name: BlueBikes Demand Prediction
  type: predictiva
  source:
    category: institution_course
    organization: MIT xPRO
    program: Professional Certificate in Advanced Analytics with AI, ML, and Data Science
    title: BlueBike case study
    url: https://executive-ed.xpro.mit.edu/professional-certificate-in-advanced-analytics-with-ai-ml-and-data-science
    description: >
      MIT xPRO presents BlueBike as a case study in which regression is used
      to predict demand, and participants build regression models and use R²
      to select the best model.
  data:
    description: >
      Public Bluebikes trip-history data for the Boston metropolitan bike-share
      system. The official data include trip duration, start and stop time,
      start and end station identifiers and names, bike identifier, and user type.
    source_url: https://bluebikes.com/system-data
    availability: public
    files: []
    notes: >
      Bluebikes publishes downloadable trip-history files periodically and also
      publishes station data. The exact historical extract used by MIT is not
      publicly identified on the program page, so a Python rewrite should use
      a frozen public Bluebikes extract while preserving the MIT analytical problem.
  original_implementation:
    technologies:
      - regression
    language: unknown
    code_available: false
    code_url: null
    notes: >
      MIT's public program page describes the case and learning objective but does
      not expose the instructional code or exact teaching dataset.
  problem:
    context: >
      Demand for a bike-sharing system varies over time and across operating
      conditions. The case studies how regression can be used to explain and
      predict Bluebikes demand.
    objective: >
      Build and compare regression models for bike-share demand and select the
      preferred model using R², following the case framing published by MIT xPRO.
    analytical_questions:
      - How does demand vary over time?
      - Which available variables are useful for predicting demand?
      - How well do alternative regression specifications explain demand?
      - Which model has the strongest R² performance under a reproducible evaluation?
  python_rewrite:
    feasible: true
    suggested_libraries:
      - pandas
      - scikit-learn
      - matplotlib
    logical_steps:
      - Download and freeze a public Bluebikes trip-history extract.
      - Load and validate trip timestamps and station fields.
      - Aggregate individual trips into a demand measure at an appropriate time resolution.
      - Create reproducible temporal and contextual predictors from the available data.
      - Define training and evaluation partitions that respect temporal order where appropriate.
      - Fit multiple regression specifications.
      - Calculate R² and complementary error metrics.
      - Compare models and interpret the most important demand patterns.
      - Produce plots and a concise evidence-based conclusion.
    expected_outputs:
      - validated analytical dataset
      - demand time series or aggregation
      - fitted regression models
      - model-comparison table
      - diagnostic and explanatory visualizations
      - written interpretation
  reproducibility:
    self_contained_python_rewrite_possible: true
    external_web_required_after_data_download: false
    authentication_required: false
  verification:
    source: verified
    data: verified
    code: partial
    already_in_inventory: false
    already_in_classroom_pre_or_lab: false
  notes: >
    High-value benchmark case because it is explicitly used in MIT xPRO continuing
    education. The public source confirms the case objective, and the official
    Bluebikes site provides recoverable public data. The exact MIT dataset and code
    are not public, so they must not be invented.

- id: 2
  name: Bike Sharing Demand - Time-Related Feature Engineering
  type: predictiva
  source:
    category: official_tutorial
    organization: scikit-learn
    program: Examples - Applications
    title: Time-related feature engineering
    url: https://scikit-learn.org/stable/auto_examples/applications/plot_cyclical_feature_engineering.html
    description: >
      Official scikit-learn example for a bike-sharing demand regression task.
      It compares alternative encodings of time-related variables and demonstrates
      periodic feature engineering with SplineTransformer.
  data:
    description: >
      Bike Sharing Demand dataset loaded from OpenML. The official example uses
      fetch_openml with dataset name Bike_Sharing_Demand and version 2.
    source_url: https://www.openml.org/search?type=data&status=active&id=44063
    availability: public
    files: []
    dataset_identifier: 44063
    notes: >
      The dataset contains 17,379 hourly observations and includes calendar,
      weather, temperature, humidity, windspeed, and bike-rental count variables.
  original_implementation:
    technologies:
      - scikit-learn
      - pandas
      - matplotlib
    language: Python
    code_available: true
    code_url: https://scikit-learn.org/stable/auto_examples/applications/plot_cyclical_feature_engineering.html
    notes: >
      The official page exposes the complete executable example and downloadable
      source/notebook through the scikit-learn examples infrastructure.
  problem:
    context: >
      Bike-sharing demand is strongly affected by daily, weekly, monthly, and
      yearly cycles. Raw ordinal representations of time can be inadequate for
      regression models because periodic relationships are not represented explicitly.
    objective: >
      Compare strategies for encoding time-related predictors and evaluate how
      cyclical and periodic feature engineering affects bike-demand regression.
    analytical_questions:
      - What temporal cycles are visible in bike demand?
      - How do ordinal and one-hot encodings represent time variables?
      - Do sine/cosine or periodic spline representations improve predictive performance?
      - How sensitive are regression results to the representation of temporal features?
  python_rewrite:
    feasible: true
    suggested_libraries:
      - pandas
      - scikit-learn
      - matplotlib
    logical_steps:
      - Load Bike_Sharing_Demand version 2 from OpenML.
      - Explore hourly and weekly demand patterns.
      - Define a reproducible regression evaluation setup.
      - Build baseline models using raw or ordinal time features.
      - Encode categorical time variables with one-hot encoding.
      - Construct cyclical sine and cosine features.
      - Construct periodic spline features with SplineTransformer.
      - Fit and evaluate the alternative pipelines.
      - Compare predictive performance and interpret the effect of feature representation.
    expected_outputs:
      - exploratory demand plots
      - alternative temporal feature matrices
      - fitted regression pipelines
      - model-comparison metrics
      - visual comparison of feature representations
      - written interpretation
  reproducibility:
    self_contained_python_rewrite_possible: true
    external_web_required_after_data_download: false
    authentication_required: false
  verification:
    source: verified
    data: verified
    code: verified
    already_in_inventory: false
    already_in_classroom_pre_or_lab: false
  notes: >
    This is distinct from the MIT BlueBikes case because its primary pedagogical
    objective is feature representation for periodic variables rather than a
    general regression-model comparison.

- id: 3
  name: Bike Sharing Demand - Lagged Features Forecasting
  type: predictiva
  source:
    category: official_tutorial
    organization: scikit-learn
    program: Examples - Applications
    title: Lagged features for time series forecasting
    url: https://scikit-learn.org/stable/auto_examples/applications/plot_time_series_lagged_features.html
    description: >
      Official scikit-learn example showing how lagged variables engineered with
      Polars can be used with HistGradientBoostingRegressor for bike-sharing demand
      forecasting, including time-aware validation and predictive uncertainty.
  data:
    description: >
      Bike Sharing Demand dataset from OpenML, dataset id 44063. The current
      scikit-learn example retrieves the raw parquet representation and validates
      it with a published SHA-256 checksum before loading it with Polars.
    source_url: https://www.openml.org/search?type=data&status=active&id=44063
    availability: public
    files:
      - dataset_44063.pq
    dataset_identifier: 44063
    direct_data_url: https://github.com/scikit-learn/examples-data/raw/refs/heads/master/bike-sharing-demand/dataset_44063.pq
    sha256: d120af76829af0d256338dc6dd4be5df4fd1f35bf3a283cab66a51c1c6abd06a
    notes: >
      The dataset contains 17,379 hourly observations. The direct parquet file and
      checksum used by the current official example make the case especially easy
      to reproduce and freeze locally.
  original_implementation:
    technologies:
      - scikit-learn
      - Polars
      - HistGradientBoostingRegressor
      - TimeSeriesSplit
      - quantile regression
      - matplotlib
    language: Python
    code_available: true
    code_url: https://scikit-learn.org/stable/auto_examples/applications/plot_time_series_lagged_features.html
    notes: >
      The official example provides complete executable code and downloadable
      Python and Jupyter notebook versions.
  problem:
    context: >
      Forecasting future bike demand from historical observations requires
      respecting temporal dependence. Random train-test splitting can leak future
      information and produce overly optimistic error estimates.
    objective: >
      Transform historical bike-demand observations into lagged supervised features,
      compare naive random validation with time-aware validation, and quantify
      forecast uncertainty.
    analytical_questions:
      - Which lagged demand variables are useful for forecasting the next hour?
      - How much does a random train-test split underestimate forecasting error?
      - How does TimeSeriesSplit change the estimated model performance?
      - What uncertainty intervals can quantile regression provide around forecasts?
  python_rewrite:
    feasible: true
    suggested_libraries:
      - polars
      - scikit-learn
      - matplotlib
      - numpy
    logical_steps:
      - Download the verified parquet dataset used by the official example.
      - Validate the file checksum.
      - Load the data with Polars.
      - Explore the demand series and descriptive statistics.
      - Create lagged and rolling-window predictors from past demand.
      - Remove observations with incomplete lag histories.
      - Fit HistGradientBoostingRegressor using a naive random split.
      - Evaluate forecasting error.
      - Replace random validation with TimeSeriesSplit.
      - Compare naive and time-aware performance estimates.
      - Fit quantile-loss models for lower and upper predictive bounds.
      - Visualize forecasts, uncertainty intervals, and actual demand.
      - Interpret temporal-validation and uncertainty results.
    expected_outputs:
      - verified local dataset
      - lagged feature table
      - fitted forecasting model
      - random-split evaluation metrics
      - time-series cross-validation metrics
      - prediction intervals
      - forecast visualizations
      - written interpretation
  reproducibility:
    self_contained_python_rewrite_possible: true
    external_web_required_after_data_download: false
    authentication_required: false
  verification:
    source: verified
    data: verified
    code: verified
    already_in_inventory: false
    already_in_classroom_pre_or_lab: false
  notes: >
    This case uses the same underlying Bike Sharing Demand dataset as case 2 but
    is a distinct case because the pedagogical problem is forecasting with lagged
    variables, leakage-aware temporal validation, and uncertainty estimation.
