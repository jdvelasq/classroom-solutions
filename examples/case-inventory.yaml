- id: -Infinity
  name: Sentiment Inference Pipeline
  domain: data_products
  source:
    category: book
    organization: Packt
    publisher: Packt
    book: Practical Deep Learning at Scale with MLflow
    title: Multi-Step Inference Pipeline
    url: https://github.com/PacktPublishing/Practical-Deep-Learning-at-Scale-with-MLFlow/tree/main/chapter07
    repository:
      url: https://github.com/PacktPublishing/Practical-Deep-Learning-at-Scale-with-MLFlow
      path: chapter07
    description: >
      Packt wraps a fine-tuned sentiment classifier as an MLflow pyfunc inference
      pipeline that adds language detection, caching, metadata, model registration,
      and scalable Spark batch inference.
  data:
    description: >
      IMDb review text used to train and exercise the sentiment inference workflow.
    source_url: https://github.com/PacktPublishing/Practical-Deep-Learning-at-Scale-with-MLFlow/tree/main/chapter08/data/imdb
    availability: repository
    files:
      - chapter08/data/imdb/train.csv
      - chapter08/data/imdb/valid.csv
      - chapter08/data/imdb/test.csv
      - chapter08/data/imdb/predict.csv
  original_implementation:
    technologies:
      - MLflow
      - PyTorch
      - pyfunc
      - model registry
      - language detection
      - LRU cache
      - PySpark batch inference
    language: Python
    code_available: true
    code_url: https://github.com/PacktPublishing/Practical-Deep-Learning-at-Scale-with-MLFlow/blob/main/chapter07/pipeline/inference_pipeline_model.py
  problem:
    context: >
      A text model intended for production needs consistent preprocessing,
      efficient repeated inference, provenance metadata, versioning, and a path
      from single predictions to large batch scoring.
    objective: >
      Package a sentiment model as a versioned multi-step inference product that
      can be loaded reproducibly and applied at batch scale.
    analytical_questions:
      - What preprocessing belongs inside the serving artifact?
      - How should model and inference-pipeline versions be tracked?
      - How can repeated requests be cached safely?
      - How can the same registered model be used for Spark batch inference?
  python_rewrite:
    feasible: true
    suggested_libraries:
      - mlflow
      - torch
      - pandas
      - pyspark
      - cachetools
    logical_steps:
      - Load or fine-tune a sentiment model.
      - Define language detection and cache preprocessing.
      - Wrap inference and metadata in an MLflow pyfunc model.
      - Define model input and output signatures.
      - Register the inference pipeline.
      - Reload the registered artifact for validation.
      - Apply the model as a Spark UDF for batch scoring.
    expected_outputs:
      - registered inference model
      - versioned model URI
      - enriched prediction responses
      - batch-scored review dataset
      - reproducible inference pipeline
  reproducibility:
    self_contained_python_rewrite_possible: true
    external_web_required_after_data_download: false
    authentication_required: false
  verification:
    source: verified
    data: verified
    code: verified

- id: -Infinity
  name: Sentiment Explainability Service
  domain: data_products
  source:
    category: book
    organization: Packt
    publisher: Packt
    book: Practical Deep Learning at Scale with MLflow
    title: NLP Sentiment Classifier Explainer
    url: https://github.com/PacktPublishing/Practical-Deep-Learning-at-Scale-with-MLFlow/blob/main/chapter10/pipeline/nlp_sentiment_classifier_explainer.py
    repository:
      url: https://github.com/PacktPublishing/Practical-Deep-Learning-at-Scale-with-MLFlow
      path: chapter10/pipeline/nlp_sentiment_classifier_explainer.py
    description: >
      Packt packages SHAP explanations for a transformer sentiment classifier as
      an MLflow pyfunc model, creating a reusable explanation artifact that returns
      serialized token-level attribution values.
  data:
    description: >
      Free-text sentiment inputs evaluated through a pretrained transformer pipeline.
    source_url: https://huggingface.co/models
    availability: model_download
    files: []
  original_implementation:
    technologies:
      - MLflow
      - SHAP
      - transformers
      - sentiment analysis
      - pyfunc
      - explainability as a service
    language: Python
    code_available: true
    code_url: https://github.com/PacktPublishing/Practical-Deep-Learning-at-Scale-with-MLFlow/blob/main/chapter10/pipeline/nlp_sentiment_classifier_explainer.py
  problem:
    context: >
      Production sentiment predictions can require inspectable explanations rather
      than a label alone, and explanation logic should be deployable and versioned
      independently from exploratory notebooks.
    objective: >
      Package token-level sentiment explanations as a reusable versioned inference artifact.
    analytical_questions:
      - Which tokens contribute most to a sentiment prediction?
      - How can explanation generation be standardized?
      - What input/output contract should an explanation service expose?
      - How should explanation artifacts be versioned and reused?
  python_rewrite:
    feasible: true
    suggested_libraries:
      - mlflow
      - shap
      - transformers
      - pandas
    logical_steps:
      - Load a pretrained sentiment pipeline.
      - Construct a SHAP explainer.
      - Generate token-level attributions.
      - Wrap explanation logic as an MLflow pyfunc model.
      - Define model signatures.
      - Log and reload the explanation artifact.
      - Validate explanations on representative text.
    expected_outputs:
      - token attribution values
      - explanation visualizations
      - registered explainer model
      - reusable explanation interface
  reproducibility:
    self_contained_python_rewrite_possible: true
    external_web_required_after_data_download: true
    authentication_required: false
  verification:
    source: verified
    data: verified
    code: verified

- id: -Infinity
  name: Holiday API Ingestion
  domain: data_for_analytics
  source:
    category: book
    organization: Packt
    publisher: Packt
    book: Data Ingestion with Python Cookbook
    title: Creating Custom Airflow Operators
    url: https://github.com/PacktPublishing/Data-Ingestion-with-Python-Cookbook/tree/main/Chapter_9/creating_custom_operators
    repository:
      url: https://github.com/PacktPublishing/Data-Ingestion-with-Python-Cookbook
      path: Chapter_9/creating_custom_operators/holiday_ingest/holiday_ingest_dag.py
    description: >
      Packt implements a custom Airflow operator for authenticated holiday-data
      ingestion and schedules a DAG that retrieves Brazilian holiday records into
      a reusable JSON analytical source.
  data:
    description: >
      Public-holiday records retrieved from an authenticated holiday API for Brazil.
    source_url: https://github.com/PacktPublishing/Data-Ingestion-with-Python-Cookbook/blob/main/datasets/holiday_brazil.json
    availability: repository_and_api
    files:
      - datasets/holiday_brazil.json
  original_implementation:
    technologies:
      - Apache Airflow
      - custom operators
      - API authentication
      - scheduled ingestion
      - JSON
    language: Python
    code_available: true
    code_url: https://github.com/PacktPublishing/Data-Ingestion-with-Python-Cookbook/blob/main/Chapter_9/creating_custom_operators/holiday_ingest/holiday_ingest_dag.py
  problem:
    context: >
      Calendar effects are often needed in downstream forecasting and operational
      analytics, so external holiday data must be acquired reproducibly rather than
      copied manually.
    objective: >
      Build a reusable scheduled ingestion component for authenticated holiday API data.
    analytical_questions:
      - How should API credentials be separated from pipeline code?
      - What logic belongs in a reusable Airflow operator?
      - How should country and year parameters be exposed?
      - How can the resulting JSON be validated for downstream analytics?
  python_rewrite:
    feasible: true
    suggested_libraries:
      - apache-airflow
      - requests
      - pandas
    logical_steps:
      - Configure the API secret outside source code.
      - Implement an authenticated holiday retrieval function.
      - Wrap retrieval in a custom Airflow operator.
      - Parameterize country, year, and output file.
      - Schedule the ingestion DAG.
      - Validate the produced JSON.
      - Prepare the holiday table for downstream joins.
    expected_outputs:
      - custom Airflow operator
      - scheduled ingestion DAG
      - holiday JSON dataset
      - ingestion validation report
  reproducibility:
    self_contained_python_rewrite_possible: false
    external_web_required_after_data_download: true
    authentication_required: true
  verification:
    source: verified
    data: verified
    code: verified
