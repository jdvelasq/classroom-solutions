- id: -Infinity
  name: Academic Paper Recommendation
  domain: predictive_analytics
  source:
    category: book
    organization: O'Reilly
    publisher: O'Reilly Media
    book: Feature Engineering for Machine Learning
    title: End-to-End Recommender Example
    url: https://github.com/alicezheng/feature-engineering-book/blob/master/09.06-14_%5BEnd-to-End_Example%5D_Recommender_Take_2.ipynb
    repository:
      url: https://github.com/alicezheng/feature-engineering-book
      path: 09.06-14_[End-to-End_Example]_Recommender_Take_2.ipynb
    description: >
      O'Reilly develops a content-based academic-paper recommender while progressively
      engineering publication year, fields of study, abstracts, authors, titles,
      and keywords to improve recommendation quality and reduce feature-space cost.
  data:
    description: >
      Microsoft Academic Graph/Open Academic Graph paper metadata including titles,
      years, fields of study, abstracts, authors, and keywords.
    source_url: https://www.openacademic.ai/oag/
    availability: external_public
    files:
      - mag_subset20K.txt
  original_implementation:
    technologies:
      - feature engineering
      - sparse matrices
      - binning
      - TF-IDF
      - one-hot encoding
      - cosine similarity
      - content-based recommendation
    language: Python
    code_available: true
    code_url: https://github.com/alicezheng/feature-engineering-book/blob/master/09.06-14_%5BEnd-to-End_Example%5D_Recommender_Take_2.ipynb
  problem:
    context: >
      Researchers need recommendations for related papers, but raw scholarly metadata
      contains heterogeneous and high-dimensional fields whose representation strongly
      affects both recommendation relevance and computational cost.
    objective: >
      Build a content-based paper recommender and quantify how successive feature
      engineering choices alter recommendation quality and feature-space efficiency.
    analytical_questions:
      - Which scholarly metadata fields produce useful similarity signals?
      - How does decade binning change the representation of publication year?
      - What do abstracts and author features add to recommendations?
      - How can sparse representations reduce computational cost?
  python_rewrite:
    feasible: true
    suggested_libraries:
      - pandas
      - scipy
      - scikit-learn
      - nltk
    logical_steps:
      - Load and clean scholarly metadata.
      - Establish a simple metadata similarity baseline.
      - Bin publication years and encode fields of study.
      - Add TF-IDF abstract features.
      - Add sparse author and keyword features.
      - Compute paper similarities efficiently.
      - Compare recommendation relevance and representation size across feature sets.
    expected_outputs:
      - engineered scholarly feature matrix
      - feature-space size comparison
      - paper similarity scores
      - ranked related-paper recommendations
      - feature engineering impact analysis
  reproducibility:
    self_contained_python_rewrite_possible: false
    external_web_required_after_data_download: false
    authentication_required: false
  verification:
    source: verified
    data: externally_referenced
    code: verified
  notes: >
    The companion repository intentionally does not redistribute the source paper
    data; the book provides external download references.

- id: -Infinity
  name: Taxi Anomaly ETML Pipeline
  domain: data_products
  source:
    category: book
    organization: Packt
    publisher: Packt
    book: Machine Learning Engineering with Python, Second Edition
    title: Extract Transform Machine Learn Load Pipeline
    url: https://github.com/PacktPublishing/Machine-Learning-Engineering-with-Python-Second-Edition/tree/main/Chapter09/etml-scripts
    repository:
      url: https://github.com/PacktPublishing/Machine-Learning-Engineering-with-Python-Second-Edition
      path: Chapter09/etml-scripts
    description: >
      Packt implements a daily Airflow ETML pipeline that extracts taxi-ride data
      from S3, clusters rides with DBSCAN, identifies anomalous rides, summarizes
      associated traffic, weather, and news with an LLM, and writes enriched output
      back to S3.
  data:
    description: >
      Simulated Glasgow taxi rides with ride distance, ride time, traffic, weather,
      and news context stored as JSON.
    source_url: https://github.com/PacktPublishing/Machine-Learning-Engineering-with-Python-Second-Edition/blob/main/Chapter09/etml-scripts/data/taxi-rides-20230524.json
    availability: repository
    files:
      - Chapter09/etml-scripts/data/taxi-rides-20230524.json
  original_implementation:
    technologies:
      - Apache Airflow
      - AWS S3
      - DBSCAN
      - StandardScaler
      - OpenAI API
      - LLM summarization
      - ETML
    language: Python
    code_available: true
    code_url: https://github.com/PacktPublishing/Machine-Learning-Engineering-with-Python-Second-Edition/tree/main/Chapter09/etml-scripts
  problem:
    context: >
      Operational taxi data arrives daily and unusual rides require more context
      than a cluster label alone; traffic, weather, and news can be summarized for
      investigation and stored as an enriched analytical product.
    objective: >
      Build an orchestrated data-and-ML pipeline that detects unusual taxi rides,
      enriches them with contextual summaries, and persists the results.
    analytical_questions:
      - Which rides form dense behavioral clusters and which are anomalies?
      - Which ride-distance and ride-time patterns trigger anomaly labels?
      - What contextual traffic, weather, and news information explains anomalous rides?
      - How should extraction, ML, enrichment, and persistence be orchestrated daily?
  python_rewrite:
    feasible: true
    suggested_libraries:
      - pandas
      - scikit-learn
      - apache-airflow
      - boto3
      - openai
    logical_steps:
      - Extract daily ride JSON from object storage.
      - Standardize ride-distance and ride-time features.
      - Cluster rides with DBSCAN.
      - Mark noise observations as anomalies.
      - Construct contextual prompts from traffic, weather, and news.
      - Summarize context for anomalous rides.
      - Persist clustered and enriched records.
      - Orchestrate the workflow with Airflow.
    expected_outputs:
      - clustered taxi ride dataset
      - anomaly labels
      - contextual anomaly summaries
      - enriched JSON output
      - reproducible Airflow DAG
  reproducibility:
    self_contained_python_rewrite_possible: false
    external_web_required_after_data_download: true
    authentication_required: true
  verification:
    source: verified
    data: verified
    code: verified
